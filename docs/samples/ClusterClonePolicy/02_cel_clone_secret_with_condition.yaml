apiVersion: admitik.dev/v1alpha1
kind: ClusterClonePolicy
metadata:
  name: 02-cel-clone-secret-with-condition
spec:

  overwriteExisting: true

  # Watch for secrets in the "infra" namespace
  watchedResources:
    - group: ""
      version: v1
      resource: secrets
      name: ""
      namespace: infra

  sources: []

  # Only clone secrets that carry the "clone-me: true" label
  conditions:
    - name: has-clone-label
      engine: cel
      key: |
        has(object.metadata.labels) && "clone-me" in object.metadata.labels && object.metadata.labels["clone-me"] == "true"
      value: "true"

  targetNamespaces:
    - namespace: app-staging
    - namespace: app-production

  # Clone the secret preserving its type and data
  object:
    engine: plain+cel
    template: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{cel: object.metadata.name }}"
      type: "{{cel: object.type }}"
      data: {{cel: object.data }}
