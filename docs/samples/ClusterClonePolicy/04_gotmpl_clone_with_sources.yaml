apiVersion: admitik.dev/v1alpha1
kind: ClusterClonePolicy
metadata:
  name: 04-gotmpl-clone-with-sources
spec:

  overwriteExisting: false

  # Only emit failure events — suppress success events for quiet operation
  eventMode: Errors

  # Watch for namespace creation/updates
  watchedResources:
    - group: ""
      version: v1
      resource: namespaces
      name: ""
      namespace: ""

  # Pull the "global-defaults" ConfigMap to inject its data into clones
  sources:
    - group: ""
      version: v1
      resource: configmaps
      filters:
        namespace:
          matchList:
            - platform
        name:
          matchList:
            - global-defaults

  # Only clone when the namespace has a specific annotation
  conditions:
    - name: wants-defaults
      engine: cel
      key: |
        has(object.metadata.annotations) && "admitik.dev/inject-defaults" in object.metadata.annotations && object.metadata.annotations["admitik.dev/inject-defaults"] == "true"
      value: "true"

  targetNamespaces:
    - namespace: team-frontend
    - namespace: team-backend
    - namespace: team-data

  # Use gotmpl to build a ConfigMap from source data
  object:
    engine: gotmpl
    template: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: injected-defaults
      data:
        {{- range $key, $value := (index .sources "/v1/configmaps" 0).data }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
